<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DX80 Web Loader</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            border: 2px solid #555;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background-color: #0078d4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #005a9e; }
        .footer { margin-top: 30px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cisco DX80 Web Integration</h1>
        <p>Wählen Sie einen Dienst zum Laden:</p>
        <a href="https://zoom.us/join" class="btn">Zoom Meeting</a>
        <a href="https://teams.microsoft.com" class="btn">MS Teams</a>
        <a href="https://google.de" class="btn">Google</a>
        <div class="footer">Geladen via System WebView</div>
    </div>
</body>
</html>
